version: "3.9"

services:
  api:
    build: ./api
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on: []

  ui:
    build: ./ui
    env_file: .env
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - ui
    env_file: .env

volumes:
  db-data:
    driver: local
